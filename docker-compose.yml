version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/url_shortener
      - SPRING_DATASOURCE_USERNAME=shauna
      - SPRING_DATASOURCE_PASSWORD=1111
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - app-network

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    networks:
      - app-network
    environment:
      - POSTGRES_DB=url_shortener
      - POSTGRES_USER=shauna
      - POSTGRES_PASSWORD=1111

networks:
  app-network:
    driver: bridge
